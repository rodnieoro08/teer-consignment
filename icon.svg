<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>TEER Consignment</title>
  <defs>
    <!-- Two arms rising from one rounded base, slightly open, like a clip. -->
    <path id="arms" d="M262 432C224 432 198 410 188 372C174 312 152 222 148 152C145 110 168 86 196 86C224 86 236 108 237 142C240 196 248 268 256 340C265 268 278 206 292 170C302 136 316 114 340 116C366 118 381 142 375 178C366 244 346 322 334 372C324 412 300 432 262 432Z"/>
    <clipPath id="clip"><use href="#arms"/></clipPath>
    <!-- Woven cover: a fine diagonal lattice. -->
    <pattern id="mesh" width="17" height="17" patternUnits="userSpaceOnUse" patternTransform="rotate(45 256 256)">
      <path d="M0 0H17M0 0V17" stroke="#0b5c6b" stroke-opacity="0.2" stroke-width="3.5" fill="none"/>
    </pattern>
    <linearGradient id="shade" x1="148" y1="0" x2="378" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b5c6b" stop-opacity="0.06"/>
      <stop offset="0.35" stop-color="#0b5c6b" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#0b5c6b" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b5c6b" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0b5c6b"/>
  <ellipse cx="264" cy="446" rx="98" ry="13" fill="#073f4a"/>
  <!-- Metal centre seen in the slit between the arms. -->
  <rect x="251" y="180" width="10" height="166" rx="5" fill="#8fbcc4"/>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="#ffffff"/>
    <rect width="512" height="512" fill="url(#mesh)"/>
    <rect width="512" height="512" fill="url(#shade)"/>
  </g>
</svg>
